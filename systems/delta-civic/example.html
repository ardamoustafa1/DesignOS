<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delta Civic system fixture</title><link rel="stylesheet" href="tokens.css"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,var(--delta-civic-accent-wash),transparent 30%),var(--delta-civic-ground);color:var(--delta-civic-ink-2);font:16px/1.6 var(--delta-civic-text)}body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.03;background-image:var(--delta-civic-grain)}main{width:min(calc(100% - 32px),var(--delta-civic-w-base));margin:auto}section{padding:96px 0;border-bottom:1px solid var(--delta-civic-ring)}h1,h2{color:var(--delta-civic-ink);font-family:var(--delta-civic-display);letter-spacing:-.04em}h1{font-size:clamp(48px,8vw,108px);line-height:.92}.artifact{max-width:var(--delta-civic-w-narrow);padding:32px;border:1px solid var(--delta-civic-ring);border-radius:var(--delta-civic-r-lg);background:var(--delta-civic-surface);box-shadow:var(--delta-civic-elev-3)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:24px;border-radius:var(--delta-civic-r-md);background:var(--delta-civic-raised);box-shadow:var(--delta-civic-elev-2)}a{display:inline-flex;min-height:48px;align-items:center;padding:0 20px;border-radius:var(--delta-civic-r-md);background:var(--delta-civic-accent);color:var(--delta-civic-on-accent);font-weight:700}.arrive{animation:arrive var(--delta-civic-t-arrive) var(--delta-civic-ease) both}@keyframes arrive{from{transform:translateY(24px)}}@media(max-width:720px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.arrive{animation:none}}.wide-contract{max-width:var(--delta-civic-w-wide)}</style></head><body><main><section class="arrive"><p>Civic / Delta Civic</p><h1>Make the signal impossible to misread.</h1><a href="#proof">Inspect the proof</a></section><section id="proof"><div class="artifact"><h2>Evidence object</h2><p>
