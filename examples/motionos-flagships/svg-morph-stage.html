<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionOS SVG Morph</title><style>
:root{color-scheme:light;--ink:#17130f;--paper:#eee7dc;--ember:#d64e24}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff,var(--paper));color:var(--ink);font-family:Arial,sans-serif}.shell{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);place-items:center;padding:6vw;gap:6vw}.shell>div{min-width:0;max-width:100%}h1{font:500 clamp(3.2rem,9vw,9rem)/.85 Georgia,serif;letter-spacing:-.07em;margin:.2em 0;overflow-wrap:anywhere}p{max-width:36ch;overflow-wrap:anywhere}button{min-height:48px;max-width:100%;padding:.8rem 1.2rem;border:1px solid currentColor;border-radius:999px;background:var(--ink);color:white;font:inherit;white-space:normal}button:focus-visible{outline:3px solid var(--ember);outline-offset:4px}svg{width:min(100%,34rem);filter:drop-shadow(0 32px 28px #6d321c38)}path{fill:var(--ember)}@media(max-width:700px){.shell{grid-template-columns:minmax(0,1fr);padding:1.5rem}svg{width:min(72vw,24rem)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main class="shell"><div><p>SVG path continuity</p><h1>Shape remembers.</h1><p>Matching path commands interpolate without snapping; reduced motion resolves directly to the destination.</p><button type="button" aria-pressed="false">Morph the object</button></div><svg viewBox="0 0 120 120" role="img" aria-label="Morphing ember form"><path d="M60 10 C90 10 110 30 110 60 C110 90 90 110 60 110 C30 110 10 90 10 60 C10 30 30 10 60 10 Z"/></svg></main><script type="module" src="./dist/svg-morph-stage.js"></script></body></html>
