<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionOS Projects</title><style>@view-transition{navigation:auto}:root{color-scheme:dark;--bg:#0c0a08;--ink:#f4eee7;--ember:#e8703a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}main{width:min(72rem,calc(100% - 2rem));margin:auto;padding:8vh 0}h1{font:500 clamp(4rem,10vw,9rem)/.85 Georgia,serif;letter-spacing:-.07em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.card{display:block;min-height:18rem;padding:2rem;border:1px solid #ffffff20;border-radius:1.5rem;background:linear-gradient(145deg,#24170f,#111);color:inherit;text-decoration:none;box-shadow:0 30px 80px #0008}.card:first-child{view-transition-name:motionos-project}.card:focus-visible{outline:3px solid var(--ember);outline-offset:4px}::view-transition-group(motionos-project){animation-duration:280ms;animation-timing-function:cubic-bezier(.2,.8,.2,1)}@media(max-width:620px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root),::view-transition-group(motionos-project){animation-duration:1ms}}</style></head><body><main><h1>Selected systems.</h1><div class="grid"><a class="card" href="detail.html"><strong>MotionOS Spatial Engine</strong><p>Open the same semantic project object.</p></a><article class="card"><strong>Evidence compiler</strong></article></div></main></body></html>
