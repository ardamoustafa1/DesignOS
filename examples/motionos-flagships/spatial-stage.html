<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionOS Spatial Product Stage</title><style>
:root{color-scheme:dark;--bg:#0d0907;--ink:#f6eee7;--ember:#e8703a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 20%,#482010,var(--bg) 48%);color:var(--ink);font:16px/1.5 Arial,sans-serif}.shell{min-height:100svh;display:grid;grid-template-columns:1fr 1.15fr;align-items:center;gap:5vw;padding:6vw}.copy{z-index:2}.eyebrow{color:var(--ember);text-transform:uppercase;letter-spacing:.14em;font-size:.75rem}h1{max-width:9ch;font:500 clamp(4rem,9vw,9rem)/.83 Georgia,serif;letter-spacing:-.07em;margin:.3em 0}p{max-width:38ch;color:#c7b7aa}#stage{height:min(78vh,760px);border:1px solid #ffffff18;border-radius:2rem;background:radial-gradient(circle,#ffffff0d,transparent 60%);box-shadow:0 50px 120px #0009,inset 0 1px #ffffff1f;overflow:hidden}canvas{width:100%;height:100%;display:block}@media(max-width:760px){.shell{grid-template-columns:1fr;padding:2rem}#stage{height:50vh}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
