name: DesignOS Review
description: Deterministic UI/design-risk review for AI-generated interfaces, with optional PR-diff scoping and an advisory model rubric pass.
author: Arda Moustafa

inputs:
  path:
    description: File or directory to review. Ignored when diff-only is true.
    required: false
    default: "."
  diff-only:
    description: Review only the reviewable files changed versus base-ref (auto-detected from GITHUB_BASE_REF on pull_request) instead of a fixed path.
    required: false
    default: "false"
  base-ref:
    description: Base ref to diff against when diff-only is true. Defaults to GITHUB_BASE_REF.
    required: false
    default: ""
  min-score:
    description: Minimum acceptable static risk floor (0-100; see LIMITATIONS.md — this is a deterministic floor, not the six-dimension design score).
    required: false
    default: "95"
  fail-under-min:
    description: Whether to fail the workflow when the score is below min-score.
    required: false
    default: "true"
  json:
    description: Also write the JSON report to designos-review.json.
    required: false
    default: "true"
  comment:
    description: Create or update a sticky pull request comment with the Markdown report.
    required: false
    default: "true"
  github-token:
    description: GitHub token with pull-requests:write permission when comment=true.
    required: false
    default: ""
  model-review:
    description: >
      Optional advisory pass — sends the reviewed files (or diff, when diff-only=true) plus
      scoring/rubric.md to the Anthropic Messages API and appends its rubric-prompted read to
      the PR comment. Never affects fail-under-min; it is explicitly non-deterministic and
      is labeled as such in the comment (CLAUDE.md Prime Directive #6 — a model pass is not
      the deterministic gate). Requires anthropic-api-key.
    required: false
    default: "false"
  anthropic-api-key:
    description: Anthropic API key for model-review. Pass via a repository secret — never hardcode.
    required: false
    default: ""
  model:
    description: Model id for model-review.
    required: false
    default: "claude-sonnet-5"

outputs:
  report-json:
    description: Path to the JSON report, when json=true.
    value: ${{ steps.review.outputs.report-json }}
  report-markdown:
    description: Path to the Markdown report.
    value: ${{ steps.review.outputs.report-markdown }}
  score:
    description: Static risk floor (see LIMITATIONS.md) — the deterministic gate, not the final design score.
    value: ${{ steps.review.outputs.score }}
  fix-prompt:
    description: Path to the agent-ready fix prompt.
    value: ${{ steps.review.outputs.fix-prompt }}

runs:
  using: composite
  steps:
    - id: review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        set -euo pipefail
        CLI="$GITHUB_ACTION_PATH/../../../bin/designos.js"
        FLAGS=("--min" "${{ inputs.min-score }}" "--no-fail")
        REVIEW_PATH="${{ inputs.path }}"
        NOTHING_TO_REVIEW=0

        if [ "${{ inputs.diff-only }}" = "true" ]; then
          BASE="${{ inputs.base-ref }}"
          if [ -z "$BASE" ]; then BASE="${GITHUB_BASE_REF:-}"; fi
          if [ -z "$BASE" ]; then
            echo "diff-only=true requires a base ref: set base-ref, or run on pull_request where GITHUB_BASE_REF is set." >&2
            exit 1
          fi
          git fetch --no-tags --depth=50 origin "$BASE" 2>/dev/null || true
          MERGE_BASE="$(git merge-base "origin/$BASE" HEAD 2>/dev/null || echo "origin/$BASE")"

          STAGE_DIR="$(mktemp -d)"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            case "$f" in
              *.html|*.css|*.js|*.jsx|*.ts|*.tsx|*.vue|*.svelte|*.mdx)
                mkdir -p "$STAGE_DIR/$(dirname "$f")"
                cp "$f" "$STAGE_DIR/$f"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" HEAD)

          if [ -z "$(find "$STAGE_DIR" -type f 2>/dev/null)" ]; then
            NOTHING_TO_REVIEW=1
          else
            REVIEW_PATH="$STAGE_DIR"
          fi
        fi

        if [ "$NOTHING_TO_REVIEW" = "1" ]; then
          echo "# DesignOS Review" > designos-review.md
          echo "" >> designos-review.md
          echo "No reviewable files (html/css/js/jsx/ts/tsx/vue/svelte/mdx) changed in this diff." >> designos-review.md
          NOW="$(node -e "console.log(new Date().toISOString())")"
          node -e "console.log(JSON.stringify({target:'diff',generatedAt:'$NOW',summary:{filesReviewed:0,findingCount:0,status:'NO REVIEWABLE FILES CHANGED',finalScore:'NOT ASSESSED',staticRiskFloor:100,staticRiskScores:{}},findings:[]},null,2))" > designos-review.json
          printf '' > designos-fix-prompt.md
          SCORE=100
        else
          node "$CLI" review "$REVIEW_PATH" "${FLAGS[@]}" --json > designos-review.json
          node "$CLI" review "$REVIEW_PATH" "${FLAGS[@]}" > designos-review.md
          node "$CLI" review "$REVIEW_PATH" "${FLAGS[@]}" --fix-prompt > designos-fix-prompt.md
          SCORE="$(node -e "const r=require('./designos-review.json'); console.log(r.summary.staticRiskFloor)")"
        fi
        cat designos-review.md

        if [ "${{ inputs.json }}" = "true" ]; then
          echo "report-json=designos-review.json" >> "$GITHUB_OUTPUT"
        fi
        echo "report-markdown=designos-review.md" >> "$GITHUB_OUTPUT"
        echo "fix-prompt=designos-fix-prompt.md" >> "$GITHUB_OUTPUT"
        echo "score=$SCORE" >> "$GITHUB_OUTPUT"

        MODEL_SECTION=""
        if [ "${{ inputs.model-review }}" = "true" ] && [ "$NOTHING_TO_REVIEW" != "1" ]; then
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "model-review=true but anthropic-api-key is empty — skipping the advisory pass." >&2
          else
            node "$GITHUB_ACTION_PATH/model-review.js" "$REVIEW_PATH" "${{ inputs.model }}" > designos-model-review.md 2>designos-model-review.err || {
              echo "Model rubric pass failed (advisory only, not gating):" >&2
              cat designos-model-review.err >&2 || true
            }
            [ -s designos-model-review.md ] && MODEL_SECTION="$(cat designos-model-review.md)"
          fi
        fi

        if [ "${{ inputs.comment }}" = "true" ] && [ -n "${GH_TOKEN:-}" ] && [ -n "${GITHUB_EVENT_PATH:-}" ]; then
          MODEL_SECTION="$MODEL_SECTION" node <<'NODE'
        const fs = require('fs');
        const https = require('https');

        const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
        const pr = event.pull_request && event.pull_request.number;
        const repo = process.env.GITHUB_REPOSITORY || '';
        const token = process.env.GH_TOKEN || '';
        if (!pr || !repo || !token) process.exit(0);

        const [owner, name] = repo.split('/');
        const marker = '<!-- designos-review-action -->';
        const report = fs.readFileSync('designos-review.md', 'utf8');
        const fix = fs.readFileSync('designos-fix-prompt.md', 'utf8');
        const modelSection = process.env.MODEL_SECTION || '';
        const modelBlock = modelSection
          ? `\n\n### Model rubric pass (advisory, non-deterministic)\n\nDoes not affect the deterministic gate above — see CLAUDE.md Prime Directive #6.\n\n${modelSection}`
          : '';
        const body = `${marker}\n${report}${modelBlock}\n\n<details><summary>Agent-ready fix prompt</summary>\n\n\`\`\`text\n${fix}\n\`\`\`\n\n</details>\n\n_Run locally with \`node DesignOS/bin/designos.js review <path> --min ${{ inputs.min-score }}\`._`;

        function request(method, path, payload) {
          return new Promise((resolve, reject) => {
            const data = payload ? JSON.stringify(payload) : '';
            const req = https.request({
              hostname: 'api.github.com',
              path,
              method,
              headers: {
                'Accept': 'application/vnd.github+json',
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                'User-Agent': 'designos-review-action',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            }, res => {
              let chunks = '';
              res.on('data', d => { chunks += d; });
              res.on('end', () => {
                const parsed = chunks ? JSON.parse(chunks) : {};
                if (res.statusCode >= 400) reject(new Error(`${method} ${path} -> ${res.statusCode}: ${chunks}`));
                else resolve(parsed);
              });
            });
            req.on('error', reject);
            if (data) req.write(data);
            req.end();
          });
        }

        (async () => {
          const comments = await request('GET', `/repos/${owner}/${name}/issues/${pr}/comments?per_page=100`);
          const previous = comments.find(comment => comment.body && comment.body.includes(marker));
          if (previous) {
            await request('PATCH', `/repos/${owner}/${name}/issues/comments/${previous.id}`, { body });
          } else {
            await request('POST', `/repos/${owner}/${name}/issues/${pr}/comments`, { body });
          }
        })().catch(error => {
          console.error(error.message);
          process.exit(1);
        });
        NODE
        fi

        if [ "${{ inputs.fail-under-min }}" = "true" ] && [ "$SCORE" -lt "${{ inputs.min-score }}" ]; then
          echo "DesignOS review score $SCORE is below required minimum ${{ inputs.min-score }}."
          exit 1
        fi
