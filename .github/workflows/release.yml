# Release pipeline: pushing a `v*` tag validates the repo, then publishes a GitHub
# Release with notes auto-extracted from the matching CHANGELOG.md section — no manual
# copy-paste. "designos" is not published to the npm registry (the bare name belongs to
# an unrelated package — see bin/designos.js); the GitHub Release + tag *is* the artifact,
# consumed via `npx github:ardamoustafa1/DesignOS init`.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: read

jobs:
  validate:
    name: Validate before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags, needed to diff starter/mobile-app against the previous
          # release tag below (a shallow checkout only has this one commit).
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Full validation suite
        run: npm run validate
      - name: Unit and product-engine tests (including browser-dependent suites)
        run: npm run test:all
      # The npm `files` allowlist is a separate surface from what's on disk in this
      # checkout — a script referenced by package.json's `bin`/`scripts` (postinstall,
      # the CLI entrypoint) can exist in the repo and still be missing from the published
      # tarball. That silently breaks every install until someone actually runs `npm
      # install` from the packed artifact, which nothing else in this pipeline did.
      - name: Install smoke test (tarball must be installable)
        run: |
          npm pack --pack-destination /tmp
          tarball="$(ls /tmp/designos-*.tgz)"
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          DESIGNOS_SKIP_PLAYWRIGHT_INSTALL=1 npm install "$tarball"
          node node_modules/designos/bin/designos.js doctor
      # This job's own npm-audit/validate/test steps are the *light* gate. The heavy one
      # — browser matrix, Lighthouse, golden-pixel regression, Firefox/WebKit smoke — runs
      # in a separate workflow (browser-gate.yml) only on push/PR to main, not on tag
      # push. Without this check, tagging any commit (including one that never went
      # through that gate, or went through it and failed) would still publish a release.
      # Require the tagged SHA to already carry a green "Required browser evidence" run.
      - name: Tagged commit has a passing Required browser evidence run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          checks="$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --paginate --jq '.check_runs[] | "\(.name)=\(.conclusion)"')"
          for required in browser-gate-required golden-pixel-required; do
            status="$(echo "$checks" | awk -F= -v name="$required" '$1==name{print $2; exit}')"
            if [ "$status" != "success" ]; then
              echo "::error::Tagged commit $sha does not have a successful '$required' check (found: '${status:-none}'). Tag a commit that has passed the Required browser evidence workflow on main."
              exit 1
            fi
          done
      - name: Mobile app dependencies
        working-directory: starter/mobile-app
        run: npm ci
      # Re-runs the audit gate directly at release time rather than trusting a
      # historical check-run, so it works the same way regardless of whether
      # native-smoke.yml's path filter matched the tagged commit.
      - name: Mobile dependency security gate
        run: node scripts/mobile-audit-gate.js
      # native-smoke.yml only runs when starter/mobile-app (or its own workflow file)
      # changes, so unlike browser-gate-required above, its checks won't exist on every
      # tagged SHA — only require them when the mobile app actually changed since the
      # last release tag; otherwise the previous release's device evidence still holds.
      - name: Tagged commit has passing native-smoke evidence, if starter/mobile-app changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          prev_tag="$(git tag --sort=-creatordate --merged "$sha" | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          if [ -z "$prev_tag" ]; then
            echo "No previous release tag found — treating this as the first release, native-smoke evidence required."
          elif git diff --quiet "$prev_tag" "$sha" -- starter/mobile-app .github/workflows/native-smoke.yml; then
            echo "starter/mobile-app unchanged since $prev_tag — native-smoke evidence from that release still applies, skipping."
            exit 0
          fi
          checks="$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --paginate --jq '.check_runs[] | "\(.name)=\(.conclusion)"')"
          for required in "iOS Simulator boot-and-render" "Android Emulator boot-and-render"; do
            status="$(echo "$checks" | awk -F= -v name="$required" '$1==name{print $2; exit}')"
            if [ "$status" != "success" ]; then
              echo "::error::starter/mobile-app changed since ${prev_tag:-the beginning of history} but tagged commit $sha does not have a successful '$required' check (found: '${status:-none}'). Push the mobile app change to main first so native-smoke.yml runs, then tag."
              exit 1
            fi
          done
      - name: Tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

  release:
    name: Publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="## [$version]" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, ver) == 1) { found=1; next } }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for ## [$version] — add one before tagging."
            exit 1
          fi
          {
            echo "Install / update:"
            echo '```bash'
            echo "npx github:ardamoustafa1/DesignOS init --agents --skills"
            echo '```'
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
            echo
            echo "---"
            echo
            cat /tmp/release-notes.md
          } > /tmp/release-body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-body.md \
            --verify-tag
