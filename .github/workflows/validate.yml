# DesignOS self-validation — runs the validators against this repo on every PR.
# Consumers: copy this into your project and point the drift/a11y steps at your src.
name: DesignOS validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Dependency security gate (high/critical blocks; moderate/low advisory only)
        run: npm audit --audit-level=high
      - name: Cross-references resolve
        run: ./validators/check-refs.sh
      - name: AGENTS.md kernel mirror in sync with CLAUDE.md
        run: diff -u CLAUDE.md AGENTS.md
      - name: Generate dependency/capability ledger and reject committed drift
        run: |
          npm run ledger:update
          npm run claims:update
          git diff --exit-code -- capabilities/ledger.json capabilities/public-claims.json README.md ARCHITECTURE.md ROADMAP.md LIMITATIONS.md .claude-plugin/plugin.json website/index.html
          npm run check:ledger
          npm run check:claims
      - name: Enforce core npm package boundary
        run: npm run check:package
      - name: Showcase pages pass a11y basics
        run: node validators/check-a11y-basics.js examples/ && node validators/check-a11y-basics.js website/
      - name: Golden artifacts pass the same mechanical floor they set
        run: node validators/check-a11y-basics.js goldens/ && node validators/check-drift.js goldens/
      - name: Showcase token contrast (muted-on-raised, the classic dark-theme failure)
        run: node validators/contrast.js "#9a9fa8" "#1b1e24" --min 4.5
