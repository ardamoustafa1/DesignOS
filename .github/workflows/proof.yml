# DesignOS live-proof pipeline.
#
# Renders the site + showcase in a real headless browser on every push and pull
# request, so "it actually works" is a checkable CI status, not a claim. This
# workflow NEVER commits back to the repo (screenshots are build artifacts only) —
# it must never introduce a bot account as a repository contributor.
name: Live proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ''
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Real CLI install end-to-end, against this exact checkout — the same command
      # every README/GETTING-STARTED.md instruction tells a real user to run.
      - name: Run the real installer end-to-end
        run: |
          mkdir -p /tmp/designos-ci-install
          cd /tmp/designos-ci-install
          node ${{ github.workspace }}/bin/designos.js init --agents --skills
          node DesignOS/bin/designos.js doctor
          echo "---"
          test -f DesignOS/CLAUDE.md || (echo "::error::CLAUDE.md missing after install" && exit 1)
          test -d .claude/agents || (echo "::error::agents not installed" && exit 1)
          test -d .claude/commands || (echo "::error::slash commands not installed" && exit 1)

      - name: Run registry-owned validators
        run: npm run validate:strict

      - name: Browser geometry, Axe, accessibility tree and runtime proof
        run: |
          node bin/browser-gate.js website/index.html --out browser-evidence/browser-gate.json --screenshots browser-evidence/screenshots
          node bin/lighthouse-gate.js website/index.html --out browser-evidence/lighthouse.json
          npm run test:goldens
          node bin/browser-ledger.js --browser browser-evidence/browser-gate.json --out browser-evidence/browser-ledger.json

      - name: Upload browser evidence as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: designos-live-proof-${{ github.sha }}
          path: browser-evidence/
          retention-days: 90
