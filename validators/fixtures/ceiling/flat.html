<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flat fixture — every ceiling tell, on purpose</title>
<style>
/* This fixture exists to fail. It is the shape of a page that passes every DesignOS
   floor (contrast, tokens, motion budget) and still reads as generated: system stack,
   one black shadow, a faded h1, four identical sections, one width, no texture. */
:root {
  --font: system-ui, -apple-system, sans-serif;
  --bg: #0e0d0c;
  --surface: #161513;
  --border: #2a2725;
  --text: #f2ede6;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}
body { background: var(--bg); color: var(--text); font-family: var(--font); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.hero h1 { font-size: clamp(2.75rem, 5vw + 1rem, 5rem); opacity: 0; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
</style>
</head>
<body>
<main>
  <section class="wrap"><div class="hero"><h1>A headline that fades in</h1></div></section>
  <section class="wrap"><div class="grid"><div class="card">One</div><div class="card">Two</div></div></section>
  <section class="wrap"><div class="grid"><div class="card">Three</div><div class="card">Four</div></div></section>
  <section class="wrap"><div class="grid"><div class="card">Five</div><div class="card">Six</div></div></section>
</main>
</body>
</html>
